# Host nginx (PM2 deployment). Build the frontend into /var/www/medix and run the API on :4000.
server {
  listen 80;
  server_name medix.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name medix.example.com;
  ssl_certificate     /etc/letsencrypt/live/medix.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/medix.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  root /var/www/medix;
  client_max_body_size 26m;
  location /api/ { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  location /socket.io/ { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
