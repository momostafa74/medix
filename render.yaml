# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates: PostgreSQL database, the API (Docker, includes Chromium for Arabic PDFs), and the web app (static site).
#
# The web app proxies /api/* to the API, so the refresh-token cookie stays first-party
# (onrender.com sub-domains count as different sites). The API and web URLs below must match
# the ones Render assigned (rewrite, VITE_SOCKET_URL, BACKEND_URL, FRONTEND_URL).

databases:
  - name: medix-db
    plan: free
    region: frankfurt
    databaseName: medix
    user: medix

services:
  - type: web
    name: medix-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Run migrations + idempotent reference seed (roles, admin, plans, locations, medicines), then start.
    dockerCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: APP_TIMEZONE
        value: Africa/Cairo
      - key: DATABASE_URL
        fromDatabase:
          name: medix-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "10"
      - key: FRONTEND_URL
        value: https://medix-web.onrender.com
      - key: BACKEND_URL
        value: https://medix-api-n40s.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_STORAGE
        value: local
      - key: PAYMENT_GATEWAY
        value: sandbox
      - key: PAYMENT_SANDBOX_SECRET
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: link
      - key: SWAGGER_ENABLED
        value: "false"
      # First super admin — Render asks for these when you apply the Blueprint.
      - key: SEED_ADMIN_NAME
        value: مدير النظام
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PHONE
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: medix-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: ""
      - key: VITE_SOCKET_URL
        value: https://medix-api-n40s.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://medix-api-n40s.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
